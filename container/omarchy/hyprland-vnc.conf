# Bare Hyprland for the wayvnc stage: one output at $VNC_RESOLUTION (set by
# omarchy-session through hyprctl), a terminal, no idle/lock daemons.
monitor = , preferred, 0x0, 1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
    kb_layout = us
}

bind = SUPER, Return, exec, foot
bind = SUPER, Q, killactive
bind = SUPER SHIFT, E, exit

exec-once = foot
